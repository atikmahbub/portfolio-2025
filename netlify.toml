# ---------------------------------------------------------------------------
# atikmahbub.netlify.app is now a REDIRECTOR ONLY.
# Hosting moved to Vercel; the canonical origin is https://atikmahbub.com.
# Keep this site deployed so old links and indexed URLs keep resolving.
#
# NOTE: @netlify/plugin-nextjs is installed via the Netlify UI (origin: ui),
# so it runs no matter what this file says, and its onBuild step fails unless
# the publish directory holds real Next.js output. That is why we still build
# the app here rather than publishing a static shell — the forced 301 below
# means none of it is ever served. See README for the cleaner alternative.
# ---------------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# --- Search Console carve-out (must come BEFORE the wildcard) ---------------
# Rules match top-down, first match wins, so this beats the /* rule below.
# The old property can only be verified by HTML file or meta tag (its DNS
# belongs to Netlify), and the wildcard would otherwise redirect the
# verification file away, eventually un-verifying the property and blocking
# the Change of Address tool. Put Google's googleXXXX.html in public/.
[[redirects]]
  from = "/google*"
  to = "/google:splat"
  status = 200

# Permanent (301) wildcard redirect. :splat carries the rest of the path
# through, so /work?src=x -> https://atikmahbub.com/work?src=x.
# force = true makes this win over the Next.js handler the plugin installs.
[[redirects]]
  from = "/*"
  to = "https://atikmahbub.com/:splat"
  status = 301
  force = true
